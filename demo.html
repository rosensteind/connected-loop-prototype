        parentId: null, clinicianId: null, housemasterId: 'p-brom',
        tags: ['Dyslexia'],
        profile: {
          strengths: ['Strong spatial reasoning.', 'Good humoured under correction.'],
          whatHelps: ['Text to speech for long reading.', 'Marking on content not spelling.'],
          earlySigns: ['Avoids reading aloud.', 'Late to English specifically.'],
          pressureFit: { suits: ['Practical work'], avoid: ['Reading aloud cold'] },
          adjustments: ['Extra time.', 'Laptop for extended writing.']
        }
      }
    ];

    /* Fourteen days of Theo. A dip mid-window that three different people
     * each see a fragment of. This is the demo's whole argument. */
    var fuel = [4, 4, 3, 4, 4, 3, 3, 2, 2, 2, 3, 3, 4, 4];
    var load = [2, 2, 3, 2, 3, 3, 4, 4, 5, 4, 4, 3, 2, 2];
    var intents = [
      'Get the maths prep done before rowing.',
      'Ask Mr Hartley the thing I did not get.',
      'Actually start prep at 7, not 8.',
      'Be on time to everything today.',
      'Finish the English essay plan.',
      'Do the reading before games.',
      'Just get through the assessment.',
      'Hand in something even if it is rough.',
      'Ask for help instead of sitting on it.',
      'One thing at a time today.',
      'Get to bed before 11.',
      'Talk to Mr Bromley about the timetable.',
      'Back to the 7pm prep start.',
      'Row well and keep the prep routine.'
    ];

    var signals = [];
    var n = 0;
    function add(type, studentId, authorId, authorRole, at, data, severity) {
      signals.push({
        id: 's' + (++n), type: type, studentId: studentId, authorId: authorId,
        authorRole: authorRole, at: at, data: data, severity: severity || 'none'
      });
    }

    for (var i = 14; i >= 1; i--) {
      var k = 14 - i;
      add('checkin', 'p-theo', 'p-theo', 'student', iso(i, 7), {
        lens: 'standard', fuel: fuel[k], intention: intents[k],
        compared: load[k] >= 4 ? 'harder' : load[k] <= 2 ? 'easier' : 'usual',
        tags: load[k] >= 4 ? ['deadline', 'sleep'] : ['ok']
      });
    }
    /* Ade and Rafi get a lighter trace so the coordinator view has a roll. */
    [4, 4, 5, 4, 3, 4, 4].forEach(function (f, j) {
      add('checkin', 'p-ade', 'p-ade', 'student', iso(7 - j, 7),
        { lens: 'standard', fuel: f, compared: f >= 4 ? 'usual' : 'harder',
          intention: 'Stick to the plan.', tags: ['ok'] });
    });

    /* What changed around him, a week before the dip — the thing the whole
     * tracking revision exists to make visible. On the marker rail it sits on
     * the same time base as the fall, which is the entire argument in one
     * picture. */
    add('environment', 'p-theo', 'p-coord', 'coordinator', iso(12, 9), {
      kind: 'timetable', from: null, until: null, staffOnly: false,
      note: 'Moved up a Maths set. Same teacher, faster pace, and a double before lunch.'
    });
    add('environment', 'p-theo', 'p-brom', 'housemaster', iso(9, 9), {
      kind: 'exams', from: null, until: null, staffOnly: false,
      note: 'Assessment week across the block.'
    });

    /* One adjustment that made it all the way, and one that has not left the
     * meeting it was agreed in. The second is the commonest failure in school
     * support and the one nobody currently notices. */
    add('adjustment', 'p-theo', 'p-nadi', 'clinician', iso(5, 16), {
      what: 'A movement break between the two Maths periods.',
      state: 'reviewed', helped: 'yes', forRoles: ['teacher'],
      agreedAt: iso(5, 16), appliedAt: iso(4, 9), reviewedAt: iso(1, 17),
      pupilNote: 'You can take five minutes between the doubles. You do not have to ask.',
      note: 'Agreed at the Centre and confirmed working by his mother and Mr Hartley.'
    });
    add('adjustment', 'p-theo', 'p-nadi', 'clinician', iso(18, 16), {
      what: 'Written instructions alongside spoken ones, in every lesson.',
      state: 'agreed', helped: 'tooEarly', forRoles: ['teacher'],
      agreedAt: iso(18, 16),
      pupilNote: 'You should get the instructions written down as well as said.',
      note: 'Agreed at the last review. Not yet passed to the teaching staff.'
    });

    add('observation', 'p-theo', 'p-hart', 'teacher', iso(11, 11), {
      subject: 'Mathematics', engagement: 4,
      note: 'Asked two good questions unprompted. Started the problem set without a nudge.'
    });
    add('observation', 'p-theo', 'p-vane', 'teacher', iso(8, 14), {
      subject: 'English', engagement: 2,
      note: 'Very quiet. Did not ask anything all lesson, which is not him. Essay plan not handed in.'
    }, 'warning');
    add('observation', 'p-theo', 'p-hart', 'teacher', iso(7, 11), {
      subject: 'Mathematics', engagement: 2,
      note: 'Handwriting has gone small and sloped. Prep half done and he told me it was finished.'
    }, 'warning');
    add('observation', 'p-theo', 'p-vane', 'teacher', iso(1, 14), {
      subject: 'English', engagement: 4,
      note: 'Back to arguing with me about the text, which is a very good sign.'
    });

    add('home', 'p-theo', 'p-mum', 'parent', iso(9, 20), {
      kind: 'Early signal',
      note: 'He rang on Sunday and was flat in a way I recognise. Two of the three things on his early-signs list. Nothing has gone wrong yet but this is usually about ten days ahead of it.'
    }, 'warning');
    add('home', 'p-theo', 'p-mum', 'parent', iso(2, 19), {
      kind: 'What is working',
      note: 'He said the movement break between doubles has made a real difference. Please keep it.'
    });

    add('pastoral', 'p-theo', 'p-brom', 'housemaster', iso(6, 21), {
      category: 'Check-in conversation', shareWithParent: true,
      note: 'Sat with him after prep. Assessment week has stacked up and he has been starting prep at 9 instead of 7. Not distressed, but running on empty.',
      action: 'Moved his prep slot earlier and told him the movement break stands.'
    });

    add('clinical', 'p-theo', 'p-nadi', 'clinician', iso(5, 16), {
      kind: 'Treatment change', shareLevel: 'pastoral',
      clinicalDetail: 'Reviewed at SCW. Titration adjusted; expect a settling period of two to three weeks with possible afternoon dip. Sleep onset to be monitored. Next review in four weeks.',
      pastoralSummary: 'A change to his treatment was made this week. Expect a two to three week settling period, with the afternoon the harder part of the day. No change to his adjustments.',
      teacherGuidance: 'Afternoons may be harder for the next fortnight. Keep the start-up delay tolerance and give written instruction alongside spoken.'
    });

    add('bridge', 'p-theo', 'p-coord', 'coordinator', iso(5, 17), {
      title: 'Clinical update relayed to pastoral team', to: ['housemaster', 'teacher', 'clinician'],
      note: 'SCW treatment change logged. Pastoral summary released to Mr Bromley; adjustment line released to Mr Hartley and Ms Vane. Parents notified that a review took place.'
    });

    add('flag', 'p-theo', 'p-coord', 'coordinator', iso(8, 9), {
      title: 'Converging signals', shareWithParent: true,
      note: 'Three independent sources within six days: load 4+ on four consecutive check-ins, an English engagement drop, and an early-signal note from home. Raised with Mr Bromley and SCW the same morning.'
    }, 'serious');

    add('observation', 'p-ade', 'p-hart', 'teacher', iso(3, 11), {
      subject: 'Mathematics', engagement: 4, note: 'Steady. Notice given about Friday room change and it was fine.'
    });
    add('pastoral', 'p-ade', 'p-brom', 'housemaster', iso(4, 20), {
      category: 'Routine change', shareWithParent: false,
      note: 'Timetable change next week. Walked him through it in advance rather than letting him find out on the day.',
      action: 'Printed timetable given Thursday.'
    });

    return {
      version: 1,
      people: people,
      students: students,
      signals: signals,
      wins: {
        'p-theo': [
          { at: iso(1, 18), text: 'Ten check-ins in a row.' },
          { at: iso(2, 18), text: 'Handed in the English plan, late but handed in.' },
          { at: iso(6, 18), text: 'Asked for help before it went wrong.' }
        ]
      },
      organisation: {
        name: 'Eton College',
        terms: { pupil: 'boy', pupils: 'boys', pupilPossessive: "boy's",
                 pastoralLead: 'housemaster', pastoralLeads: 'housemasters',
                 house: 'house', yearGroup: 'block',
                 clinicalService: 'the Stephenson Centre', organisation: 'Eton' },
        /* The demo shows the find-me button, so the demo has to name somebody
         * on duty. A real school fills this in itself, and until it does the
         * button does not appear anywhere. */
        onCall: {
          who: 'The Dame on duty',
          where: 'Godolphin House, ground floor',
          contact: '01753 000 000',
          hours: 'Any time, day or night',
          safePlace: 'your own room',
          note: 'Demonstration rota. A real school names its own people here.'
        }
      },
      digestFocus: {
        'p-theo': {
          week: 'This week',
          schoolFocus: 'Getting prep started at 7pm rather than 9pm.',
          homeReinforce: 'If he rings, ask what time he started prep, not whether he finished it.',
          goingWell: 'Rowing attendance is unbroken and he is asking questions in class again.'
        }
      }
    };
  }

  /* ------------------------------------------------------------ lifecycle */

  function read() {
    try {
      var raw = global.localStorage.getItem(KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && parsed.version === 1) return parsed;
      }
    } catch (e) { /* private browsing, file:// restrictions */ }
    return null;
  }

  function write() {
    try { global.localStorage.setItem(KEY, JSON.stringify(db)); }
    catch (e) { /* keep working in memory */ }
  }

  function load() {
    db = read() || seed();
    return db;
  }

  function reset() {
    db = seed();
    write();
    emit();
  }

  function onChange(fn) { listeners.push(fn); }
  function emit() { listeners.forEach(function (f) { f(); }); }

  /* --------------------------------------------------------------- reads */

  function people() { return db.people; }
  function person(id) { return db.people.filter(function (p) { return p.id === id; })[0]; }
  function students() { return db.students; }
  function student(id) { return db.students.filter(function (s) { return s.id === id; })[0]; }

  function rawSignals(studentId) {
    return db.signals
      .filter(function (s) { return !studentId || s.studentId === studentId; })
      .sort(function (a, b) { return new Date(b.at) - new Date(a.at); });
  }

  /* The only way a view should ever get signals. */
  function timeline(studentId, viewer, opts) {
    opts = opts || {};
    var out = [];
    rawSignals(studentId).forEach(function (s) {
      var v = global.CL.project(s, viewer);
      if (!v) return;
      if (opts.types && opts.types.indexOf(v.type) === -1) return;
      if (opts.sinceDays != null && new Date(v.at) < startOfDaysAgo(opts.sinceDays)) return;
      out.push(v);
    });
    if (opts.limit) out = out.slice(0, opts.limit);
    return out;
  }

  function checkins(studentId, days) {
    var since = startOfDaysAgo(days == null ? 14 : days);
    return db.signals
      .filter(function (s) {
        return s.type === 'checkin' && s.studentId === studentId && new Date(s.at) >= since;
      })
      .sort(function (a, b) { return new Date(a.at) - new Date(b.at); });
  }

  /* The only thing a chart is ever handed. Points carry the metrics the
   * viewer is entitled to and the intention text only if their role may read
   * it, so a parent's tooltip cannot show what a housemaster's does. */
  function checkinSeries(studentId, viewer, days) {
    return checkins(studentId, days).map(function (s) {
      var v = global.CL.project(s, viewer);
      if (!v || !v.metrics) return null;
      /* Spread the metrics rather than naming two of them. Naming fuel and
       * load here was the offline twin of the chart bug: a boy on any other
       * lens produced points with nothing in them. */
      var point = { at: s.at, intention: v.intention || null };
      for (var key in v.metrics) point[key] = v.metrics[key];
      return point;
    }).filter(Boolean);
  }

  function streak(studentId) {
    var byDay = {};
    db.signals.forEach(function (s) {
      if (s.type === 'checkin' && s.studentId === studentId) byDay[dayKey(new Date(s.at))] = true;
    });
    var count = 0, d = new Date();
    if (!byDay[dayKey(d)]) d.setDate(d.getDate() - 1); /* today not done yet is fine */
    while (byDay[dayKey(d)]) { count++; d.setDate(d.getDate() - 1); }
    return count;
  }

  function checkedInToday(studentId) {
    var today = dayKey(new Date());
    return db.signals.some(function (s) {
      return s.type === 'checkin' && s.studentId === studentId && dayKey(new Date(s.at)) === today;
    });
  }

  function wins(studentId) { return (db.wins[studentId] || []).slice(); }
  function digest(studentId) { return db.digestFocus[studentId] || null; }
  function organisation() { return db.organisation || { name: 'The school', terms: {} }; }

  /* The offline twin of the adjustment route. Same narrowness: state, whether
   * it helped, and the note between adults. What the adjustment IS is never
   * rewritten here either, so the demo cannot show a behaviour the real
   * system refuses. */
  /* The offline twin of the find-me press. It writes the same record and
   * returns the same shape, so the demo shows exactly what the real thing
   * does — including that it tells him who to go and find rather than
   * claiming to have sent anybody. */
  /* Writes without emitting, for the same reason as the connected twin: a
   * repaint here destroys the panel holding the name and number of whoever is
   * on duty, which is the only part of this that helps. */
  function pressFindMe(studentId, body) {
    body = body || {};
    var org = organisation();
    /* Unknown level falls to the louder of the two, exactly as the server
     * does. The demo must not show a gentler behaviour than the real thing. */
    var level = body.level === 'findme' ? 'findme' : 'emergency';
    var safePlace = (org.onCall && org.onCall.safePlace) || 'your own room';

    addSignalQuietly('findme', studentId, studentId, 'student', {
      level: level, safePlace: safePlace,
      note: String(body.note || '').trim(), where: String(body.where || '').trim(),
      tellParents: body.tellParents === true, acknowledgedAt: null
    }, 'critical');

    var leads = db.people.filter(function (p2) {
      return ['housemaster', 'coordinator'].indexOf(p2.role) > -1;
    }).map(function (p2) { return p2.name; });

    return Promise.resolve({
      ok: true, logged: true, level: level,
      onCall: org.onCall || null,
      alsoTold: leads,
      instruction: level === 'emergency' ? 'Go to ' + safePlace + ' now, and stay there.' : null,
      safePlace: level === 'emergency' ? safePlace : null,
      doNotWait: level === 'emergency'
        ? 'If you are in danger right now, call 999. That works whether or not this app does.'
        : 'Do not wait for this screen. Go and find them, or call the number. ' +
          'If you are in danger right now, call 999.'
    });
  }

  /* The offline twin of the on-call queue. Same shape as the server's, so one
   * piece of view code serves both builds. */
  function findMePresses() {
    return db.signals
      .filter(function (s2) { return s2.type === 'findme'; })
      .sort(function (a, b) {
        var ackA = a.data.acknowledgedAt ? 1 : 0, ackB = b.data.acknowledgedAt ? 1 : 0;
        if (ackA !== ackB) return ackA - ackB;
        var emA = (a.data.level || 'emergency') === 'emergency' ? 0 : 1;
        var emB = (b.data.level || 'emergency') === 'emergency' ? 0 : 1;
        if (emA !== emB) return emA - emB;
        return new Date(b.at) - new Date(a.at);
      })
      .map(function (s2) {
        var st = student(s2.studentId) || {};
        return {
          id: s2.id, at: s2.at, studentName: st.name || null, house: st.house || null,
          level: s2.data.level || 'emergency', safePlace: s2.data.safePlace || null,
          note: s2.data.note || '', where: s2.data.where || '',
          acknowledgedAt: s2.data.acknowledgedAt || null,
          acknowledgedBy: s2.data.acknowledgedBy || null
        };
      });
  }

  function acknowledgeFindMe(signalId, outcome) {
    db.signals.forEach(function (s2) {
      if (s2.id !== signalId || s2.type !== 'findme') return;
      s2.data.acknowledgedAt = new Date().toISOString();
      s2.data.outcome = String(outcome || '').trim();
    });
    write();
    emit();
    return Promise.resolve(true);
  }

  function updateSignal(signalId, patch, studentId) {
    var sig = null;
    db.signals.forEach(function (x) { if (x.id === signalId) sig = x; });
    if (!sig || sig.type !== 'adjustment') return Promise.resolve(false);
    if (studentId && sig.studentId !== studentId) return Promise.resolve(false);

    var order = global.CL.ADJUSTMENT_ORDER;
    var current = sig.data.state || 'agreed';
    if (patch.state && order.indexOf(patch.state) < order.indexOf(current)) return Promise.resolve(false);

    var stamp = new Date().toISOString();
    if (patch.state) {
      sig.data.state = patch.state;
      if (patch.state === 'communicated') sig.data.communicatedAt = stamp;
      if (patch.state === 'applied') sig.data.appliedAt = stamp;
      if (patch.state === 'reviewed') sig.data.reviewedAt = stamp;
    }
    if (patch.helped) sig.data.helped = patch.helped;
    if (typeof patch.note === 'string') sig.data.note = patch.note;
    write();
    emit();
    return Promise.resolve(true);
  }

  /* -------------------------------------------------- pattern recognition
   *
   * "Patterns go unrecognised." The loop's job is to notice when independent
   * sources agree inside one window, which is exactly what no single person
   * in the current arrangement can see.
   */
  function patterns(studentId) {
    var found = [];
    var win = 7;
    var since = startOfDaysAgo(win);
    var recent = db.signals.filter(function (s) {
      return s.studentId === studentId && new Date(s.at) >= since;
    });

    var sources = {};
    var evidence = [];

    var heavy = recent.filter(function (s) {
      return s.type === 'checkin' &&
        (s.data.load >= 4 || s.data.fuel <= 2 || s.data.compared === 'harder');
    });
    if (heavy.length >= 3) {
      sources.student = true;
      evidence.push(heavy.length + ' check-ins at low fuel or harder than usual');
    }
    var lowObs = recent.filter(function (s) { return s.type === 'observation' && s.data.engagement <= 2; });
    if (lowObs.length >= 1) {
      sources.teacher = true;
      evidence.push('engagement drop in ' + lowObs.map(function (s) { return s.data.subject; }).join(', '));
    }
    var homeFlag = recent.filter(function (s) { return s.type === 'home' && s.data.kind === 'Early signal'; });
    if (homeFlag.length >= 1) {
      sources.parent = true;
      evidence.push('early signal from home');
    }
    var clin = recent.filter(function (s) { return s.type === 'clinical'; });
    if (clin.length >= 1) {
      sources.clinician = true;
      evidence.push('clinical change in the same window');
    }

    var count = Object.keys(sources).length;
    if (count >= 3) {
      found.push({
        kind: 'converging',
        severity: 'serious',
        title: 'Converging signals from ' + count + ' independent sources',
        detail: evidence.join(' · '),
        sources: Object.keys(sources)
      });
    } else if (count === 2) {
      found.push({
        kind: 'watch',
        severity: 'warning',
        title: 'Two sources agreeing',
        detail: evidence.join(' · '),
        sources: Object.keys(sources)
      });
    }

    /* What changed around them, on a wider window than the rest.
     *
     * Mirrors server/src/patterns.js, and for the same reason: circumstance
     * PRECEDES what it explains, so a set change twelve days ago is exactly
     * the reason for this week's dip. Deliberately not counted as a source —
     * a room move is not evidence about a boy, and letting it raise the count
     * would manufacture patterns out of school logistics. */
    var changeSince = startOfDaysAgo(21);
    var changes = db.signals.filter(function (s) {
      return s.studentId === studentId && s.type === 'environment' &&
        new Date(s.at) >= changeSince;
    });
    if (changes.length && (count >= 2 || heavy.length >= 2)) {
      found.push({
        kind: 'circumstance',
        severity: 'none',
        title: changes.length === 1
          ? 'Something changed around them recently'
          : changes.length + ' things changed around them recently',
        detail: changes.map(function (s) { return s.data.kind; }).join(' · ') +
          ' — worth asking about before anything else. Circumstance is the part a school can change.',
        sources: ['environment']
      });
    }

    /* An adjustment agreed and never applied. Nobody is at fault for this and
     * nobody notices it, which is exactly what a system should watch for. */
    var stalled = db.signals.filter(function (s) {
      return s.studentId === studentId && s.type === 'adjustment' &&
        ['agreed', 'communicated'].indexOf(s.data.state || 'agreed') > -1 &&
        new Date(s.at) < startOfDaysAgo(14);
    });
    if (stalled.length) {
      found.push({
        kind: 'stalled',
        severity: 'warning',
        title: stalled.length === 1
          ? 'An adjustment agreed a fortnight ago is not yet in place'
          : stalled.length + ' adjustments agreed a fortnight ago are not yet in place',
        detail: stalled.map(function (s) { return s.data.what; }).filter(Boolean).join(' · '),
        sources: ['coordinator']
      });
    }

    /* Silence is also a signal. */
    var last = db.signals
      .filter(function (s) { return s.studentId === studentId && s.type === 'checkin'; })
      .sort(function (a, b) { return new Date(b.at) - new Date(a.at); })[0];
    if (!last) {
      found.push({
        kind: 'quiet', severity: 'warning',
        title: 'Never checked in',
        detail: 'He has not started using his own tool. Worth a conversation before it is worth a chase.',
        sources: ['student']
      });
    } else if ((Date.now() - new Date(last.at)) > 3 * 864e5) {
      found.push({
        kind: 'quiet', severity: 'warning',
        title: 'No check-in for three days',
        detail: 'The boy has stopped using his own tool, which is usually the first thing to go.',
        sources: ['student']
      });
    }
    return found;
  }

  /* -------------------------------------------------------------- writes */

  function addSignalQuietly(type, studentId, authorId, authorRole, data, severity) {
    var sig = {
      id: 's' + Date.now() + Math.floor(Math.random() * 1000),
      type: type, studentId: studentId, authorId: authorId, authorRole: authorRole,
      at: new Date().toISOString(), data: data, severity: severity || 'none'
    };
    db.signals.push(sig);
    write();
    return sig;
  }

  function addSignal(type, studentId, authorId, authorRole, data, severity) {
    var sig = addSignalQuietly(type, studentId, authorId, authorRole, data, severity);
    emit();
    return sig;
  }

  /* The offline prototype keeps the same surface so views.js never has to ask
   * which build it is running in. */
  /* Writes without emitting, so the boy's confirmation is not torn down by a
   * re-render. Mirrors the connected store deliberately. */
  function raiseConcern(studentId, body) {
    db.signals.push({
      id: 's' + Date.now() + Math.floor(Math.random() * 1000),
      type: 'concern', studentId: studentId, authorId: studentId, authorRole: 'student',
      at: new Date().toISOString(),
      data: { note: body.note, urgency: body.urgency, tellParents: !!body.tellParents, acknowledgedAt: null },
      severity: body.urgency === 'today' ? 'serious' : 'warning'
    });
    write();
    return { seenBy: ['Mr Bromley', 'Ms Aluko'], whenSeen: 'when they next look',
      reminder: 'If you need someone now, do not wait for this. Use a number below or find any adult.' };
  }

  function concerns() {
    return db.signals
      .filter(function (s) { return s.type === 'concern'; })
      .sort(function (a, b) { return new Date(b.at) - new Date(a.at); })
      .map(function (s) {
        var st = student(s.studentId);
        return { id: s.id, at: s.at, body: s.data.note, urgency: s.data.urgency,
          studentName: st ? st.name : s.studentId, acknowledgedAt: s.data.acknowledgedAt };
      });
  }

  function acknowledgeConcern(id, outcome) {
    db.signals.forEach(function (s) {
      if (s.id === id) { s.data.acknowledgedAt = new Date().toISOString(); s.data.outcome = outcome; }
    });
    write(); emit();
  }

  function help() { return null; }

  /* Mirrors the connected store so views.js needs no branch. */
  function setLens(studentId, lens) {
    db.students.forEach(function (st) {
      if (st.id === studentId) {
        st.profile = st.profile || {};
        st.profile.lens = lens;
      }
    });
    write(); emit();

        return el('li', {}, [el('span', { text: w.text }), el('em', { text: ui.ago(w.at) })]);
      })),
      el('div', { class: 'row' }, [winInput, btn('Add', function () {
        if (!winInput.value.trim()) return;
        ui.after(store.addWin(sid, winInput.value.trim()), function () {
          ui.toast('Added.');
        });
      })])
    ]));
  };

  /* Talk to someone.
   *
   * Three tiers, in the order a boy in difficulty needs them: right now,
   * someone here, someone outside. The national numbers are last because they
   * are the fallback, and present always because at 2am they are the only
   * ones awake. Nothing here is behind a tap he has to discover. */
  function helpCard(ctx, sid) {
    var H = CL.HELP_ROUTES;
    var t = T(ctx, store.student(sid));
    var body = [];

    body.push(el('div', { class: 'help-emergency' }, [
      el('strong', { text: H.emergency.label }),
      el('span', { class: 'help-action', text: H.emergency.action }),
      el('span', { class: 'help-detail', text: H.emergency.detail })
    ]));

    /* ------------------------------------------------- the two red buttons
     *
     * Two, because they ask for two different things and the difference is
     * what a boy should DO.
     *
     *   Emergency — stop where you are, go to your room, stay there. Staff
     *               come to him. He is not sent walking a dark school looking
     *               for an adult, and whoever responds has a door to knock on
     *               rather than a building to search.
     *   Find me   — he is all right to walk. Here is who is on duty, where,
     *               and their number.
     *
     * Neither exists until the school has named somebody actually on duty. A
     * button that summons nobody is worse than no button, so an unconfigured
     * organisation gets the phone numbers and the ordinary request instead.
     */
    var org = store.organisation() || {};
    var onCall = org.onCall || org.on_call || null;

    if (onCall && onCall.who && onCall.contact) {
      var pressed = el('div', {});

      function press(levelId) {
        var lvl = CL.URGENCY_LEVELS[levelId];
        return function () {
          ui.after(store.pressFindMe(sid, { level: levelId }), function (r) {
            var oc = (r && r.onCall) || onCall;
            ui.clear(pressed);

            var lines = [];
            /* The instruction comes FIRST, in the imperative, before any
             * explanation. A frightened adolescent can follow "go to your
             * room"; they cannot follow a paragraph. */
            lines.push(el('strong', { text: (r && r.instruction) || lvl.heading }));

            if (levelId === 'emergency') {
              lines.push(el('p', { text: 'You do not have to explain anything to anyone on the way.' }));
              /* "so has your housemaster" — the subject is the adult, who is
               * always singular, not the pupil. Agreeing this with his
               * pronoun set produced "so have your housemaster". */
              lines.push(el('p', { text: oc.who + ' has been told, and so has your ' +
                t('{pastoralLead}') + '.' }));
            } else {
              lines.push(el('p', { class: 'findme-contact', text: oc.who }));
              lines.push(el('p', { text: oc.where }));
            }

            lines.push(el('p', { class: 'findme-contact', text: oc.contact }));
            lines.push(el('p', { text: oc.hours }));
            lines.push(el('p', { class: 'flag-line tone-warning',
              text: (r && r.doNotWait) ||
                'If you are in danger right now, call 999. That works whether or not this app does.' }));

            pressed.appendChild(el('div', { class: 'findme-sent findme-sent-' + levelId }, lines));
          });
        };
      }

      var buttons = el('div', { class: 'findme-wrap' }, [
        el('button', {
          type: 'button', class: 'findme findme-emergency',
          onclick: press('emergency')
        }, [CL.URGENCY_LEVELS.emergency.button]),
        el('p', { class: 'findme-blurb', text: CL.URGENCY_LEVELS.emergency.blurb }),

        el('button', {
          type: 'button', class: 'findme findme-urgent',
          onclick: press('findme')
        }, [CL.URGENCY_LEVELS.findme.button]),
        el('p', { class: 'findme-blurb', text: CL.URGENCY_LEVELS.findme.blurb }),

        el('p', { class: 'findme-who' }, [
          el('span', { text: 'On now: ' + onCall.who + ' · ' + onCall.where + ' · ' + onCall.contact +
                             '. ' + onCall.hours + '.' }),
          ui.info('What these buttons do', [
            'Both write down that you pressed, and tell whoever is on duty plus your ' +
              t('{pastoralLead}') + ' and the ' + t('{coordinator}') + '. Not your teachers.',
            { who: 'Emergency', what: 'Go to ' + (onCall.safePlace || 'your own room') +
              ' and stay there. Someone comes to you. Use it if you should not be walking about.' },
            { who: 'Find me', what: 'You go to them. Use it if you are all right to walk.' },
            'Neither one sends anybody by itself. This is a screen, and a screen cannot walk ' +
              'down a corridor \u2014 so go, or call the number.',
            { who: 'Your parents', what: 'Not told, unless you say so.' },
            'If you are in danger right now, call 999. That always works and does not need this app.'
          ])
        ]),
        pressed
      ]);
      body.push(buttons);
    }

    /* Asking a member of staff to find him. */
    var ask = { note: '', urgency: 'today', tellParents: false };
    var sent = el('div', {});
    var noteBox = el('textarea', {
      class: 'text-input', rows: '3',
      placeholder: 'You do not have to explain. "Can someone find me" is enough.',
      oninput: function () { ask.note = this.value; }
    });
    var urgHolder = el('div', { class: 'chips' });
    function drawUrg() {
      ui.clear(urgHolder);
      ['today', 'this week', 'no rush'].forEach(function (u) {
        urgHolder.appendChild(el('button', {
          type: 'button', class: 'chip' + (ask.urgency === u ? ' is-on' : ''),
          onclick: function () { ask.urgency = u; drawUrg(); }, text: u
        }));
      });
    }
    drawUrg();

    var tellBox = el('input', { type: 'checkbox',
      onchange: function () { ask.tellParents = this.checked; } });

    var askPanel = el('details', { class: 'help-ask' }, [
      el('summary', {}, [
        el('span', { text: 'Ask someone at school to talk to me' }),
        ui.info('What happens to this', [
          'It goes to your ' + t('{pastoralLead}') + ' and the ' + t('{coordinator}') + ', and to ' +
            'anyone clinical working with you.',
          { who: 'Your teachers', what: 'Never see this. Not the fact of it, not a word of it.' },
          { who: 'Your parents', what: 'Only if you tick the box below.' },
          'Nobody is watching the screen for this. They see it when they next look, which is ' +
            'usually the same day. If it cannot wait, use the numbers here or find any adult.'
        ])
      ]),
      el('div', { class: 'help-ask-body' }, [
        noteBox,
        el('div', { class: 'q' }, [el('label', { text: 'How soon?' }), urgHolder]),
        el('label', { class: 'check' }, [tellBox,
          el('span', { text: 'Tell my parents I asked. Leave this unticked and they will not be told.' })]),
        btn('Send it', function () {
          ui.after(store.raiseConcern(sid, ask), function (r) {
            askPanel.open = true;
            ui.toast('Sent. Someone will come and find you.');
            ui.clear(sent);
            var who = (r && r.seenBy && r.seenBy.length)
              ? r.seenBy.join(' and ')
              : 'your housemaster and the coordinator';
            sent.appendChild(el('p', { class: 'flag-line tone-good',
              text: 'Sent. ' + who + ' will see it ' +
                    ((r && r.whenSeen) || 'when they next open this') + '.' }));
            sent.appendChild(el('p', { class: 'flag-line tone-warning',
              text: (r && r.reminder) ||
                'If you need someone now, do not wait for this. Use a number below or find any adult.' }));
            noteBox.value = ''; ask.note = '';
          });
        }, 'primary'),
        sent
      ])
    ]);
    body.push(askPanel);

    body.push(el('p', { class: 'help-lead', text: 'Free, any time, and they do not tell your school.' }));
    body.push(el('ul', { class: 'help-list' }, H.external.map(function (h) {
      return el('li', {}, [
        el('div', {}, [
          el('strong', { text: h.name }),
          el('span', { class: 'help-detail', text: h.detail })
        ]),
        el('span', { class: 'help-contact', text: h.contact })
      ]);
    })));

    return card({
      class: 'card-help',
      title: 'Talk to someone',
      sub: 'Any time, for any reason, including none.'
    }, body);
  }

  function rebuildScale(q, name, value, onpick, labels) {
    var old = q.querySelector('.scale') && q.querySelector('.scale').parentNode;
    var fresh = ui.scale(name, value, onpick, labels);
    if (old && old.parentNode === q) q.replaceChild(fresh, old);
    else if (q.children.length > 1) q.replaceChild(fresh, q.children[1]);
  }

  /* ================================================================ TEACHER
   * A teacher has thirty seconds between lessons. One page, one flag, one box. */

  VIEWS.teacher = function (root, ctx) {
    var sid = ctx.studentId;
    var st = store.student(sid);
    var t = T(ctx, st);

    root.appendChild(hero(st.name + (st.year ? ' · ' + st.year : ''), 'What you need before the lesson, and one box after it.'));

    /* Morning flag: today's check-in projected for a teacher, plus any live guidance. */
    var todays = store.timeline(sid, ctx.viewer, { types: ['checkin'], sinceDays: 1 });
    var guidance = store.timeline(sid, ctx.viewer, { types: ['clinical'], sinceDays: 21 });
    var flagBody = [];
    if (todays.length) flagBody.push(el('p', { class: 'flag-line tone-warning', text: 'Low-fuel morning. Expect a slower start. Not defiance.' }));
    else flagBody.push(el('p', { class: 'flag-line tone-good', text: 'No flag this morning.' }));
    guidance.forEach(function (g) {
      flagBody.push(el('p', { class: 'flag-line tone-info', text: g.body }));
    });
    root.appendChild(card({ title: 'This morning' }, flagBody));

    root.appendChild(profileCard(st, ctx));

    /* Weekly observation */
    var obs = { subject: (ctx.viewer.subject || 'Mathematics'), engagement: 0, note: '' };
    var subjSel = el('select', { class: 'text-input', onchange: function () { obs.subject = this.value; } },
      ['Mathematics', 'English', 'Science', 'History', 'Games'].map(function (s) {
        return el('option', { value: s, selected: s === obs.subject ? 'selected' : null, text: s });
      }));
    var noteBox = el('textarea', {
      class: 'text-input', rows: '3',
      placeholder: 'One observation. What you saw, not what you concluded.',
      oninput: function () { obs.note = this.value; }
    });
    var engHolder = el('div', {});
    function drawEng() {
      ui.clear(engHolder).appendChild(
        ui.scale('Engagement', obs.engagement, function (v) { obs.engagement = v; drawEng(); }, ['Withdrawn', 'Fully in it'])
      );
    }
    drawEng();

    root.appendChild(card({
      title: 'Weekly observation',
      sub: t('Goes to the {pastoralLead} and the {coordinator}. Not to the {pupil}, and not to their family verbatim.')
    }, [
      el('div', { class: 'q' }, [el('label', { text: 'Subject' }), subjSel]),
      el('div', { class: 'q' }, [el('label', { text: 'Engagement this week' }), engHolder]),
      el('div', { class: 'q' }, [el('label', { text: 'Note' }), noteBox]),
      btn('Send to the loop', function () {
        if (!obs.engagement) { ui.toast('Pick an engagement rating.'); return; }
        ui.after(store.addSignal('observation', sid, ctx.viewer.personId, 'teacher', {
          subject: obs.subject, engagement: obs.engagement, note: obs.note.trim()
        }, obs.engagement <= 2 ? 'warning' : 'none'), function () {
          ui.toast(t.cap('{pastoralLead}') + ' and the ' + t('{coordinator}') + ' have it.');
        });
      }, 'primary')
    ]));

    add(root, guidanceCard(ctx, st));

    root.appendChild(card({
      title: 'Recent, as far as you see it',
      sub: 'Pastoral and clinical detail is deliberately withheld. You get the headline and the adjustment.'
    }, [ui.timelineList(store.timeline(sid, ctx.viewer, { sinceDays: 21, limit: 12 }), store)]));
  };

  /* =============================================== adjustments and context
   *
   * Two cards shared by every role that can see them, rather than written
   * three times in three views and drifting apart. What each ROLE may do with
   * them is decided here in one place; what each role may SEE is decided in
   * project(), as always.
   */

  /* What is in place for this boy, and how far each thing has actually got.
   *
   * The board is deliberately readable by the boy himself. An adjustment he
   * is entitled to but does not know about is not an adjustment, it is a
   * secret, and a boy who cannot say "I am supposed to get five extra
   * minutes" cannot ask for it when the adult forgets. */
  function adjustmentsCard(ctx, sid) {
    var t = T(ctx, store.student(sid));
    var role = ctx.viewer.role;
    var items = store.timeline(sid, ctx.viewer, { sinceDays: 365, types: ['adjustment'] });

    /* Who may move a thing along. A teacher marks "in place", because they
     * are the only person who can honestly report that it is happening in the
     * room. A pupil moves nothing: this is a record of what adults did. */
    var mayAdvance = ['teacher', 'housemaster', 'coordinator', 'clinician', 'therapist'].indexOf(role) > -1;
    var mayCreate = ['housemaster', 'coordinator', 'clinician', 'therapist'].indexOf(role) > -1;

    function stateRow(v) {
      var at = CL.ADJUSTMENT_ORDER.indexOf(v.state);
      return el('div', { class: 'states' }, CL.ADJUSTMENT_ORDER.map(function (id, i) {
        return el('span', {
          class: 'state' + (i <= at ? ' is-done' : '') + (i === at ? ' is-now' : ''),
          text: CL.ADJUSTMENT_STATES[id].label
        });
      }));
    }

    function advance(v) {
      var i = CL.ADJUSTMENT_ORDER.indexOf(v.state);
      if (i < 0 || i >= CL.ADJUSTMENT_ORDER.length - 1) return null;
      var next = CL.ADJUSTMENT_ORDER[i + 1];
      return btn(CL.ADJUSTMENT_STATES[next].label, function () {
        var patch = { state: next };
        if (next === 'applied') patch.appliedAt = new Date().toISOString();
        if (next === 'reviewed') patch.reviewedAt = new Date().toISOString();
        ui.after(store.updateSignal(v.id, patch, sid), function () {
          ui.toast('Marked ' + CL.ADJUSTMENT_STATES[next].label.toLowerCase() + '.');
        });
      }, 'quiet');
    }

    var body = [];
    if (!items.length) {
      body.push(ui.empty(mayCreate
        ? 'Nothing recorded yet. An adjustment written down is one somebody can be reminded of.'
        : 'Nothing recorded yet.'));
    }
    items.forEach(function (v) {
      var row = el('div', { class: 'adj' + (v.state === 'agreed' || v.state === 'communicated' ? ' adj-open' : '') }, [
        el('strong', { text: v.headline }),
        stateRow(v),
        v.body ? el('p', { class: 'note', text: v.body }) : null,
        el('div', { class: 'adj-foot' }, [
          v.helpedLabel ? pill('Helped: ' + v.helpedLabel, v.helped === 'yes' ? 'good' : 'muted') : null,
          mayAdvance ? advance(v) : null
        ].filter(Boolean))
      ].filter(Boolean));
      body.push(row);
    });

    if (mayCreate) {
      var draft = { what: '', note: '' };
      body.push(el('div', { class: 'q' }, [
        el('label', { text: 'Add an adjustment' }),
        el('input', { class: 'text-input', type: 'text', maxlength: '160',
          placeholder: 'What should happen. e.g. Five extra minutes to start written work.',
          oninput: function () { draft.what = this.value; } })
      ]));
      /* No "why" field, and that is the design. What to do travels to a
       * teacher; why stays in the clinical record. */
      body.push(el('p', { class: 'note', text:
        t('What to do, never why. A teacher does not need a diagnosis to give {them} five extra minutes, ' +
          'and the reason belongs in the clinical record.') }));
      body.push(btn('Record it', function () {
        if (!draft.what.trim()) { ui.toast('Say what the adjustment is.'); return; }
        ui.after(store.addSignal('adjustment', sid, ctx.viewer.personId, role, {
          what: draft.what.trim(), state: 'agreed', agreedAt: new Date().toISOString(),
          helped: 'tooEarly', note: '', forRoles: ['teacher']
        }), function () { ui.toast('Recorded as agreed. Now somebody has to pass it on.'); });
      }, 'primary'));
    }

    return card({
      title: 'What is in place',
      sub: 'Agreed is not the same as happening. This is how far each one has actually got.'
    }, body);
  }

  /* What changed around him. A fact about a building and a timetable, which
   * is why everybody attached can see it and why it carries no severity. */
  function environmentCard(ctx, sid) {
    var role = ctx.viewer.role;
    var items = store.timeline(sid, ctx.viewer, { sinceDays: 60, types: ['environment'] });
    var mayWrite = ['teacher', 'housemaster', 'coordinator'].indexOf(role) > -1;

    var body = [];
    body.push(el('p', { class: 'note', text:
      'A school cannot change how a boy feels. It can change his room, his timetable and who ' +
      'teaches him. Recording that is what lets a dip be read against what caused it.' }));

    if (!items.length) body.push(ui.empty('Nothing recorded in the last two months.'));
    items.forEach(function (v) {
      body.push(el('div', { class: 'env-row' }, [
        pill(v.headline, 'muted'),
        el('span', { class: 'env-when', text: v.when || ui.dateShort(v.at) }),
        v.body ? el('span', { class: 'env-note', text: v.body }) : null
      ].filter(Boolean)));
    });

    if (mayWrite) {
      var draft = { kind: 'timetable', note: '', from: '', staffOnly: false };
      var kindSel = el('select', { class: 'text-input', onchange: function () { draft.kind = this.value; } },
        CL.ENVIRONMENT_ORDER.map(function (k) {
          return el('option', { value: k, text: CL.ENVIRONMENT_KINDS[k].label });
        }));
      body.push(el('div', { class: 'grid grid-2' }, [
        el('div', { class: 'q' }, [el('label', { text: 'What changed' }), kindSel]),
        el('div', { class: 'q' }, [el('label', { text: 'From when' }),
          el('input', { class: 'text-input', type: 'date',
            oninput: function () { draft.from = this.value; } })])
      ]));
      body.push(el('div', { class: 'q' }, [el('label', { text: 'Detail, if it helps' }),
        el('input', { class: 'text-input', type: 'text', maxlength: '160',
          placeholder: 'e.g. Moved from the Wyatt room to the annexe.',
          oninput: function () { draft.note = this.value; } })]));
      /* The one exception to "everybody sees it": a staff change before it is
       * announced is somebody else's employment matter. */
      var soBox = el('input', { type: 'checkbox', onchange: function () { draft.staffOnly = this.checked; } });
      body.push(el('label', { class: 'check' }, [soBox,
        el('span', { text: 'Staff only for now — not yet announced' })]));
      body.push(btn('Record the change', function () {
        ui.after(store.addSignal('environment', sid, ctx.viewer.personId, role, {
          kind: draft.kind, from: draft.from || null, until: null,
          note: draft.note.trim(), staffOnly: draft.staffOnly
        }), function () { ui.toast('Recorded.'); });
      }));
    }

    return card({ title: 'What changed around him', sub: 'Circumstance, not character.' }, body);
  }

 * The app is six different views of one record, and its whole argument only
 * lands if you visit them in the right order. Handed to somebody cold, that
 * argument is invisible: they click one role, see a page of cards, and close
 * the tab. So the demo explains itself.

      title: '8. What changed around him, and what we did about it',
      body: [
        'Scroll to "What is in place". One adjustment has gone all the way to reviewed and is working. The other was agreed a fortnight ago and has not left the meeting it was agreed in — which is the commonest failure in school support and the one nobody currently notices.',
        'There is no box for WHY. What to do travels to a teacher; the reason stays in the clinical record. A teacher does not need a diagnosis to give a boy five extra minutes, and the absence of the field is what guarantees they are never sent one.',
        'Below it, "What changed around him": a Maths set change twelve days ago, assessment week nine days ago. A school cannot change how a boy feels. It can change his room, his timetable and who teaches him.',
        'Look back at the pattern view. Those changes are the ◇ markers sitting on the same time base as the dip.'
      ]
    },
    {
      role: 'coordinator',
      title: '9. Ms Aluko, and the argument',
      body: [
        'Here it is: converging signals from three independent sources inside six days.',
        'Four low check-ins Theo told no one about. An engagement drop only Ms Vane saw. An early signal only his mother saw. Nobody in the current arrangement could see all three.',
        'Underneath it, in grey rather than red: two things changed around him recently. That is context, not evidence — recording a room change can never manufacture a pattern about a child, and there is a test that proves it does not.',
        'It raises a prompt for a person to act on. It never decides anything, sends anything, or scores him. That boundary is deliberate and it is what keeps this out of medical device regulation.'
      ]
    },
    {
      role: null,
      title: 'What this is not',
      body: [
        'Not a diagnostic tool. Not treatment. Not monitoring. Nothing here screens, scores or classifies a child.',
        'Not an emergency service either, and the emergency button does not change that. It writes a record and names whoever is on duty. It cannot make a person appear, and it says so on the screen every single time, next to 999.',
        'Two decisions in it are really the school’s, not the software’s: whether a boy’s own written words should reach his parents, and what he can see of his own record.',
        'Those are the two I most want you to disagree with me about. “Two questions for you” in the sidebar puts them to you directly, and copies your answers out as text you can email.'
      ],
      cta: 'Answer the two questions',
      go: 'feedback'
    }
  ];

  var state = { open: false, i: 0 };

  function done() {
    try { return global.localStorage.getItem(KEY) === 'yes'; } catch (e) { return false; }
  }
  function markDone() {
    try { global.localStorage.setItem(KEY, 'yes'); } catch (e) { /* private mode */ }
  }

  function render() {
    var host = ui.clear(document.getElementById('tour-host'));
    if (!state.open) { host.hidden = true; return; }
    host.hidden = false;

    var step = STEPS[state.i];
    var last = state.i === STEPS.length - 1;

    host.appendChild(el('div', { class: 'tour' }, [
      el('div', { class: 'tour-head' }, [
        el('span', { class: 'tour-count', text: state.i === 0 ? 'Walkthrough' : state.i + ' of ' + (STEPS.length - 2) }),
        el('button', {
          class: 'tour-close', type: 'button', 'aria-label': 'Close the walkthrough',
          onclick: close, text: '×'
        })
      ]),
      el('h2', { text: step.title }),
      el('div', { class: 'tour-body' }, step.body.map(function (p) {
        return el('p', { text: p });
      })),
      el('div', { class: 'tour-foot' }, [
        state.i > 0 ? el('button', {
          class: 'btn btn-quiet', type: 'button', text: 'Back',
          onclick: function () { go(state.i - 1); }
        }) : el('span', {}),
        el('button', {
          class: 'btn btn-primary', type: 'button',
          text: step.cta || (last ? 'Finish' : 'Next'),
          onclick: function () {
            if (step.go && global.CL.tourOpenPanel) { close(); global.CL.tourOpenPanel(step.go); return; }
            last ? close() : go(state.i + 1);
          }
        })
      ])
    ]));
  }

  function go(i) {
    state.i = Math.max(0, Math.min(STEPS.length - 1, i));
    var role = STEPS[state.i].role;
    if (role && global.CL.tourSetRole) global.CL.tourSetRole(role);
    render();
  }

  function open() { state.open = true; state.i = 0; render(); }
  function close() { state.open = false; markDone(); render(); }

  /* Offered on a first visit, and always available from the sidebar.
   *
   * ?tour=1 opens it whatever the browser remembers. The landing page is an
   * introduction TO the guide, so somebody who has just pressed "Start the
   * walkthrough" must get the walkthrough — not a silent app because they
   * happened to look at this once a fortnight ago. ?tour=0 is the escape
   * hatch for the person who wants to look around on their own. */
  function init() {
    var btn = document.getElementById('btn-tour');
    if (btn) btn.addEventListener('click', open);

    var asked = null;
    try { asked = new URLSearchParams(global.location.search).get('tour'); } catch (e) { /* old browser */ }

    if (asked === '0') { markDone(); return; }
    if (asked === '1' || !done()) setTimeout(open, 400);
  }

  CL.tour = { open: open, close: close, init: init, render: render };

})(window);


/* ---- js/feedback.js ---- */
/* Capturing the reader's view.
 *
 * Two decisions in this system are the school's rather than the software's,
 * and they are currently engineering defaults standing in for a policy that
 * does not exist. The person most qualified to argue with them is a parent.
 *
 * So the demo asks. Answers stay in this browser until the reader chooses to
 * copy them out — nothing is transmitted anywhere, which is the only honest
 * arrangement for a page that also says nothing is transmitted anywhere.
 */
(function (global) {
  'use strict';

  var CL = global.CL, ui = CL.ui, el = ui.el;
  var KEY = 'connected-loop:feedback';

  var QUESTIONS = [
    {
      id: 'ownWords',
      title: 'Should a boy’s own written words reach his parents?',
      context:
        'His scores go to them either way. The sentence he types — "ask for help instead of sitting on it" — currently does not. ' +
        'The reasoning: a boy who believes his mother reads every line stops writing true ones, and then the tool is worth nothing to anybody. ' +
        'The counter-argument is just as real: parents hold years of observation, the proposal wants them as contributors, and withholding a child’s own words is the school deciding what a family may know.',
      options: [
        { id: 'keep', label: 'Keep them private, as built' },
        { id: 'share', label: 'Parents should see them' },
        { id: 'choice', label: 'The boy should choose, per entry' },
        { id: 'age', label: 'It should depend on his age' }
      ]
    },
    {
      id: 'ownRecord',
      title: 'What should a boy see of his own record?',
      context:
        'Today he sees his own check-ins and wins, and none of the pastoral or clinical notes written about him. ' +
        'There is no clean age line in the UK — the test is understanding, not birthday. A boy in F Block is very likely competent to ask for his own record, and to object to his parents having it.',
      options: [
        { id: 'own', label: 'Only what he wrote, as built' },
        { id: 'pastoral', label: 'His pastoral notes too' },
        { id: 'all', label: 'Everything held about him' },
        { id: 'ask', label: 'On request, with a conversation' }
      ]
    }
  ];

  var answers = load();

  function load() {
    try { return JSON.parse(global.localStorage.getItem(KEY) || '{}'); }
    catch (e) { return {}; }
  }
  function save() {
    try { global.localStorage.setItem(KEY, JSON.stringify(answers)); }
    catch (e) { /* private mode: answers live for this visit only */ }
  }

  /* ------------------------------------------------------------- rendering */

  function panel() {
    var wrap = el('div', { class: 'prose' });

    wrap.appendChild(el('p', {
      text: 'Two decisions in this system are not the software’s to make. Both are built one way today, and both are one line to change. Your view is worth more than mine here.'
    }));
    wrap.appendChild(el('p', {
      class: 'note',
      text: 'Nothing is sent anywhere. Your answers stay in this browser until you copy them out at the bottom.'
    }));

    QUESTIONS.forEach(function (q) {
      var chosen = answers[q.id] || {};
      var opts = el('div', { class: 'fb-options' });

      function draw() {
        ui.clear(opts);
        q.options.forEach(function (o) {
          opts.appendChild(el('button', {
            type: 'button',
            class: 'fb-option' + (chosen.choice === o.id ? ' is-on' : ''),
            onclick: function () {
              chosen.choice = o.id;
              chosen.choiceLabel = o.label;
              answers[q.id] = chosen;
              save();
              draw();
            }
          }, [el('span', { text: o.label })]));
        });
      }
      draw();

      wrap.appendChild(el('section', { class: 'fb-q' }, [
        el('h3', { text: q.title }),
        el('p', { class: 'fb-context', text: q.context }),
        opts,
        el('textarea', {
          class: 'text-input', rows: '2',
          placeholder: 'Why, or what you would do instead. Optional.',
          value: chosen.note || '',
          oninput: function () { chosen.note = this.value; answers[q.id] = chosen; save(); }
        })
      ]));
    });

    /* Anything else she noticed. Often the most useful part. */
    wrap.appendChild(el('section', { class: 'fb-q' }, [
      el('h3', { text: 'Anything else' }),
      el('p', { class: 'fb-context', text: 'What is wrong, missing, or would not survive contact with a real school week.' }),
      el('textarea', {
        class: 'text-input', rows: '4',
        placeholder: 'Notes as you go.',
        value: answers.general || '',
        oninput: function () { answers.general = this.value; save(); }
      })
    ]));

    var out = el('textarea', { class: 'text-input fb-out', rows: '8', readonly: 'readonly' });
    var copyBtn = ui.button('Copy my answers', function () {
      out.value = summarise();
      out.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { /* fall through */ }
      if (global.navigator && global.navigator.clipboard) {
        global.navigator.clipboard.writeText(out.value).then(function () {
          ui.toast('Copied. Paste it into an email.');
        }, function () {
          ui.toast(ok ? 'Copied.' : 'Select the text below and copy it.');
        });
      } else {
        ui.toast(ok ? 'Copied.' : 'Select the text below and copy it.');
      }
    }, 'primary');

    wrap.appendChild(el('div', { class: 'panel-actions' }, [
      copyBtn,
      el('p', { class: 'note', text: 'Copies everything above as plain text, ready to paste into an email.' }),
      out
    ]));

    return wrap;
  }

  function summarise() {
    var lines = ['The Connected Loop — my answers', ''];
    QUESTIONS.forEach(function (q) {
      var a = answers[q.id] || {};
      lines.push(q.title);
      lines.push('  Answer: ' + (a.choiceLabel || '(not answered)'));
      if (a.note && a.note.trim()) lines.push('  Note:   ' + a.note.trim());
      lines.push('');
    });
    if (answers.general && answers.general.trim()) {
      lines.push('Anything else');
      lines.push('  ' + answers.general.trim().replace(/\n/g, '\n  '));
      lines.push('');
    }
    lines.push('Sent from the Connected Loop prototype, ' + new Date().toLocaleDateString('en-GB'));
    return lines.join('\n');
  }

  CL.feedback = { panel: panel, summarise: summarise };

})(window);


/* ---- js/app.js ---- */
/* The Connected Loop — shell, role switching, boot. */
(function (global) {
  'use strict';

  var CL = global.CL, ui = CL.ui, el = ui.el, store = CL.store;

  /* Who each role signs in as in the demo. In production this comes from the
   * school's identity provider; nothing else about the app changes. */
  var IDENTITY = {
    student: { personId: 'p-theo', studentId: 'p-theo' },
    teacher: { personId: 'p-hart', studentId: 'p-theo', subject: 'Mathematics' },
    housemaster: { personId: 'p-brom', studentId: 'p-theo' },
    clinician: { personId: 'p-nadi', studentId: 'p-theo' },
    parent: { personId: 'p-mum', studentId: 'p-theo' },
    coordinator: { personId: 'p-coord', studentId: 'p-theo' }
  };

  var state = { role: 'coordinator', studentId: 'p-theo', panel: null };

  /* Role labels carry terminology placeholders ({Pupil}, {PastoralLead}) so
   * one build serves any school. They must be rendered through the helper,
   * never printed raw. */
  function roleLabel(role) {
    var t = CL.terms((store.organisation() || {}).terms, null);
    var R = CL.ROLES[role];
    return R ? t.cap(R.label) : role;
  }

  function viewer() {
    var id = IDENTITY[state.role];
    return {
      role: state.role,
      personId: id.personId,
      subject: id.subject,
      studentIds: state.role === 'parent' ? ['p-theo'] : store.students().map(function (s) { return s.id; })
    };
  }

  /* ------------------------------------------------------------- chrome */

  function renderNav() {
    var nav = ui.clear(document.getElementById('role-nav'));
    /* Only roles this offline demo has a person for. Therapist and
     * administrator exist in the model but have no seeded identity here. */
    CL.ROLE_ORDER.filter(function (r) { return IDENTITY[r]; }).forEach(function (r) {
      var R = CL.ROLES[r];
      nav.appendChild(el('button', {
        type: 'button',
        class: 'role-tab accent-' + R.accent + (state.role === r ? ' is-on' : ''),
        'aria-pressed': state.role === r ? 'true' : 'false',
        onclick: function () { setRole(r); }
      }, [
        el('strong', { text: roleLabel(r) }),
        el('span', { text: R.cadence })
      ]));
    });
  }

  function renderStudentPicker() {
    var host = ui.clear(document.getElementById('student-picker'));
    var bar = document.querySelector('.topbar');
    /* A parent sees one boy. A student sees himself. Nobody else's names
     * should even be renderable for those roles. */
    if (state.role === 'student' || state.role === 'parent') {
      host.hidden = true;
      bar.hidden = true;
      return;
    }
    host.hidden = false;
    bar.hidden = false;
    host.appendChild(el('span', { class: 'picker-label', text: 'Viewing' }));
    store.students().forEach(function (s) {
      host.appendChild(el('button', {
        type: 'button',
        class: 'chip' + (state.studentId === s.id ? ' is-on' : ''),
        onclick: function () { state.studentId = s.id; render(); },
        text: s.name
      }));
    });
  }

  function renderContext() {
    var box = ui.clear(document.getElementById('role-context'));
    var R = CL.ROLES[state.role];
    var who = store.person(IDENTITY[state.role].personId);
    box.appendChild(el('div', { class: 'ctx-who' }, [
      el('strong', { text: who.name }),
      el('span', { text: who.detail })
    ]));
    box.appendChild(el('p', { class: 'ctx-blurb',
      text: CL.terms((store.organisation() || {}).terms, null)(R.blurb) }));
  }

  function setRole(r) {
    state.role = r;
    if (r === 'student' || r === 'parent') state.studentId = 'p-theo';
    state.panel = null;
    render();
  }

  /* --------------------------------------------------------------- panels */

  function openPanel(kind) {
    state.panel = kind;
    render();
  }

  function renderPanel() {
    var host = ui.clear(document.getElementById('panel-host'));
    if (!state.panel) { host.hidden = true; return; }
    host.hidden = false;

    var body, title;
    if (state.panel === 'permissions') {
      title = 'Who sees what';
      body = CL.permissionsPanel();
    } else if (state.panel === 'feedback') {
      title = 'Two questions for you';
      body = CL.feedback.panel();
    } else {
      title = 'About this build';
      body = aboutPanel();
    }

    host.appendChild(el('div', { class: 'panel-scrim', onclick: function () { state.panel = null; render(); } }));
    host.appendChild(el('div', { class: 'panel', role: 'dialog', 'aria-modal': 'true', 'aria-label': title }, [
      el('header', { class: 'panel-head' }, [
        el('h2', { text: title }),
        el('button', { class: 'panel-close', type: 'button', 'aria-label': 'Close', onclick: function () { state.panel = null; render(); }, text: '×' })
      ]),
      el('div', { class: 'panel-body' }, [body])
    ]));
  }

  function aboutPanel() {
    function p(t) { return el('p', { text: t }); }
    return el('div', { class: 'prose' }, [
      el('h3', { text: 'What this is' }),
      p('A working MVP of the Connected Loop: one shared, role-based picture of a neurodivergent boy, assembled from the people who each hold a fragment of it.'),
      el('h3', { text: 'What it demonstrates' }),
      el('ul', {}, [
        el('li', { text: 'Six roles, each seeing a genuinely different projection of the same record.' }),
        el('li', { text: 'The clinical bridge: a milestone at the Stephenson Centre reaching the pastoral team at a level the clinician chooses.' }),
        el('li', { text: 'A two-way parent portal, where a note from home lands with the coordinator immediately.' }),
        el('li', { text: 'Pattern recognition across sources, which is the thing no single person in the current arrangement can do.' }),
        el('li', { text: 'The boy at the centre, with a tool that reads as his rather than as monitoring.' })
      ]),
      el('h3', { text: 'Where it runs' }),
      p('One responsive web app. Chrome or Edge on a Windows machine, Safari on an iPad, installable to the home screen. No install on the school estate, no Mac dependency.'),
      el('h3', { text: 'What is stubbed' }),
      p('Data persists to this browser only, and identity is a role switcher rather than a school sign-in. Both sit behind one seam in the data layer; the views above it do not change when a real backend goes in.'),
      el('div', { class: 'panel-actions' }, [
        ui.button('Reset the demo data', function () {
          store.reset();
          ui.toast('Demo data reset.');
        })
      ])
    ]);
  }

  /* --------------------------------------------------------------- render */

  function render() {
    renderNav();
    renderStudentPicker();
    renderContext();
    renderPanel();
    if (CL.tour) CL.tour.render();

    var main = ui.clear(document.getElementById('main'));
    main.className = 'main accent-' + CL.ROLES[state.role].accent;
    var fn = CL.views[state.role];
    fn(main, {
      viewer: viewer(),
      organisation: store.organisation(),
      studentId: state.studentId,
      go: function (sid) { state.studentId = sid; render(); }
    });
    main.scrollTop = 0;
  }

  /* ----------------------------------------------------------------- boot */

  function boot() {
    store.load();
    store.onChange(render);

    /* The tour drives the role switcher, so it can show each view as it
     * talks about it. */
    CL.tourSetRole = function (r) { setRole(r); };
    CL.tourOpenPanel = function (k) { openPanel(k); };
    if (CL.tour) CL.tour.init();

    var fb = document.getElementById('btn-feedback');
    if (fb) fb.addEventListener('click', function () { openPanel('feedback'); });
    document.getElementById('btn-permissions').addEventListener('click', function () { openPanel('permissions'); });
    document.getElementById('btn-about').addEventListener('click', function () { openPanel('about'); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && state.panel) { state.panel = null; render(); }
    });

    render();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

})(window);

</script>
